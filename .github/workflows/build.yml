name: build

# main 에 올라올 때마다: 읽기 전용 검사 + Windows PowerShell 5.1 구문 검사 + bat 빌드
# v* 태그를 달면: 위 검사를 통과한 빌드 결과와 SHA256SUMS.txt 로 Release 를 만든다
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 읽기 전용 검사
        env:
          PYTHONIOENCODING: utf-8
        run: python verify.py

      - name: bat 빌드 + SHA256
        env:
          PYTHONIOENCODING: utf-8
        run: python build.py

      - name: Windows PowerShell 5.1 구문 검사
        shell: powershell
        run: |
          $s = Get-Content -LiteralPath dist\MinerHunter-Collector.bat -Raw -Encoding UTF8
          $i = $s.LastIndexOf('#' + 'PSSTART')
          if ($i -lt 0) { throw 'PSSTART marker missing' }  # 인라인 스크립트는 BOM 없이 저장돼 PS 5.1 이 한글을 깨뜨린다 — 영어만
          $null = [scriptblock]::Create($s.Substring($i))
          $null = [scriptblock]::Create((Get-Content -LiteralPath collector.ps1 -Raw -Encoding UTF8))
          'parse ok'

      - uses: actions/upload-artifact@v4
        with:
          name: MinerHunter-Collector
          path: dist/

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "GitHub Actions 가 이 태그의 소스로 빌드했습니다 (읽기 전용 검사·PowerShell 5.1 구문 검사 통과)."
            echo
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
            echo
            echo "license.infralog.kr/tools 에서 받은 파일이 이 빌드와 같은지 확인:"
            echo
            echo '```powershell'
            echo 'Get-FileHash .\MinerHunter-Collector.bat -Algorithm SHA256'
            echo '```'
          } > notes.md
          gh release create "$GITHUB_REF_NAME" dist/MinerHunter-Collector.bat dist/SHA256SUMS.txt collector.ps1 \
            --title "MinerHunter Collector $GITHUB_REF_NAME" --notes-file notes.md
